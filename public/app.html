<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahorro Compartido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#121620;--muted:#5d6675;--line:#e2e5ea;--accent:#1f6feb;--accent-soft:#e9f1fe;--good:#167a48;--good-soft:#e5f3ec;--warn:#8a4b00;--warn-soft:#fff3e2;--bad:#b42318;--bad-soft:#fdecea;--grey:#c5c9d0}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0f1724;color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:14px}
.top .sp{flex:1}.top .who{color:#aeb7c6;font-size:13px}
.top button{border:1px solid #3a475c;background:transparent;color:#cfd6e2;border-radius:8px;padding:6px 10px;font-size:12px}
.portal{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
@media(max-width:820px){.portal{grid-template-columns:1fr}.side{display:flex;overflow-x:auto}}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px}
.side .co{padding:6px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .co b{display:block}.side .co span{font-size:12px;color:var(--muted)}
.side a{display:flex;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.side a.on{background:var(--accent-soft);color:var(--accent)}
.content{padding:24px 28px;max-width:1080px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px}.kpi .s{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-grey{background:#eef0f3;color:var(--muted)}.p-blue{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;margin-bottom:14px;color:var(--muted);font-size:13px}
label.f b{display:flex;justify-content:space-between;color:var(--ink);font-weight:600;font-size:14px;margin-bottom:5px}
label.f b output{color:var(--accent)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=month],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;margin-bottom:2px}.opt span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:140px}
.note{font-size:12px;color:var(--muted)}
.callout{padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:#173b7a;font-size:13px;margin-bottom:14px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}.callout.good{background:var(--good-soft);color:var(--good)}.callout.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:26px}
.auth{max-width:440px;margin:6vh auto;padding:0 16px}
.tabs2{display:flex;background:#eef0f3;border-radius:10px;padding:4px;margin-bottom:16px}
.tabs2 button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:12px 0}
.check input{margin-top:3px}
/* employee */
.emp{max-width:520px;margin:0 auto;padding:18px 16px 90px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.mc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.mc h3{margin:0 0 8px;font-size:14px}
.mv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mv:last-child{border:0}.mv small{display:block;color:var(--muted);font-size:12px}
.stack{height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--line);margin:10px 0}.stack i{height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line)}
.tabbar div{display:flex;max-width:520px;width:100%}
.tabbar button{flex:1;border:0;background:none;padding:10px 0 14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--accent);font-weight:600}.tabbar span{font-size:18px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#0f1724;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.copy{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f6f7f9;border:1px solid var(--line);border-radius:8px;padding:6px 8px;word-break:break-all}
.simbar{background:#ff8a00;color:#1d1300;padding:9px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.simbar .tag{background:#1d1300;color:#ffb347;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:3px 8px;font-size:12px}
.simbar button{border:1px solid rgba(29,19,0,.35);background:rgba(255,255,255,.55);color:#1d1300;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.simbar button.on{background:#1d1300;color:#fff;border-color:#1d1300}.simbar .sp{flex:1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/"><i>◎</i>Ahorro Compartido</a><div class="sp"></div><span class="who" id="who"></span><button id="logout" class="hide">Salir</button></div>
<div id="simbar" class="simbar hide"></div>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const $ = id => document.getElementById(id);
const root = $('root');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => '$' + Math.round(+v || 0).toLocaleString('es-UY');
const usd = v => 'US$ ' + (+v || 0).toLocaleString('es-UY', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = v => (Math.round((+v || 0) * 100) / 100).toLocaleString('es-UY') + '%';
const sgn = v => v === null || v === undefined ? '—' : (v >= 0 ? '+' : '') + pct(v * 100);
const col = v => v >= 0 ? 'var(--good)' : 'var(--bad)';
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const per = p => p ? MES[+p.slice(5, 7) - 1] + ' ' + p.slice(0, 4) : '—';
const ymNow = () => new Date().toISOString().slice(0, 7);
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); };
async function api(method, url, body){
  const r = await fetch(url, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin'});
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
const QS = location.search; let ME = null, VIEW = 'inicio', AUTHTAB = QS.includes('registro') ? 'registro' : 'login', QUIEN = QS.includes('empleado') ? 'empleado' : QS.includes('empresa') ? 'empresa' : '';

async function boot(){
  if (location.pathname === '/simulacion'){ root.innerHTML = '<div class="auth"><div class="card"><h1>Preparando el ejemplo…</h1><p class="sub">Creamos una empresa de ejemplo con empleados y casi dos años de aportes a precios reales de mercado.</p></div></div>'; await api('POST', '/api/simulacion/iniciar', {como: location.search.includes('empleado') ? 'empleado' : 'empresa'}); history.replaceState(null, '', '/app'); VIEW = 'inicio'; ETAB = 'inicio'; }
  const inv = location.pathname.match(/^\/invitacion\/([\w-]+)/);
  ME = await api('GET', '/api/me');
  await simBar();
  $('who').textContent = ME.usuario ? ME.usuario.nombre + (ME.empresa ? ' · ' + ME.empresa.nombre : '') : '';
  $('logout').classList.toggle('hide', !ME.usuario);
  if (inv && (!ME.usuario || ME.empresa?.simulacion)) return invitation(inv[1]);
  if (inv) return invitationLoggedIn(inv[1]);
  if (!ME.usuario) return authView();
  if (ME.usuario.rol === 'empresa') return ME.empresa.planOk ? portal() : planSetup(true);
  return employee();
}
$('logout').onclick = async () => { if (ME.empresa?.simulacion){ await api('POST', '/api/simulacion/salir'); location.href = '/'; return; } await api('POST', '/api/auth/logout'); location.href = '/app'; };
async function simBar(){
  const bar = $('simbar');
  bar.classList.add('hide'); return;
  const d = await api('GET', '/api/simulacion/perfiles');
  bar.innerHTML = `<span class="tag">SIMULACIÓN</span><span>Empresa y personas de ejemplo, separadas de las cuentas reales. Se borra sola en 24 h. Ver como:</span>
    ${d.perfiles.map(p => `<button data-u="${p.id}" class="${p.id === d.actual ? 'on' : ''}">${esc(p.nombre)}</button>`).join('')}
    ${d.invitaciones.map(i => `<button data-inv="${i.token}">Invitación de ${esc(i.nombre.split(' ')[0])}</button>`).join('')}
    <span class="sp"></span><button id="sOut">Salir de la simulación</button>`;
  bar.classList.remove('hide');
  bar.querySelectorAll('[data-u]').forEach(b => b.onclick = async () => { await api('POST', '/api/simulacion/cambiar', {usuarioId: +b.dataset.u}); VIEW = 'inicio'; ETAB = 'inicio'; history.replaceState(null, '', '/app'); boot(); });
  bar.querySelectorAll('[data-inv]').forEach(b => b.onclick = () => { history.replaceState(null, '', '/invitacion/' + b.dataset.inv); boot(); });
  $('sOut').onclick = async () => { await api('POST', '/api/simulacion/salir'); location.href = '/'; };
}

// ================= AUTH =================
function authView(){
  root.innerHTML = `<div class="auth"><div class="card">
    <h1 style="margin-bottom:6px">${AUTHTAB === 'registro' ? 'Comenzá tu plan' : QUIEN === 'empleado' ? 'Ingresá a tu cuenta' : QUIEN === 'empresa' ? 'Ingresá como empresa' : 'Ingresá a tu cuenta'}</h1>
    <p class="sub">${AUTHTAB === 'registro' ? 'Creá la cuenta de tu empresa y configurá el beneficio en dos minutos.' : QUIEN === 'empleado' ? 'Usá el mail y la contraseña que creaste con tu invitación.' : QUIEN === 'empresa' ? 'Entrá al portal de RR.HH. para ver a tu equipo y aprobar los aportes.' : 'Empresas y empleados entran con su mail.'}</p>
    ${QUIEN === 'empleado' ? '' : `<div class="tabs2"><button data-t="login" class="${AUTHTAB === 'login' ? 'on' : ''}">Ingresar</button><button data-t="registro" class="${AUTHTAB === 'registro' ? 'on' : ''}">Comenzar plan</button></div>`}
    ${AUTHTAB === 'login' ? `
      <label class="f"><b>Mail</b><input type="email" id="lEmail" autocomplete="email"></label>
      <label class="f"><b>Contraseña</b><input type="password" id="lPass" autocomplete="current-password"></label>
      <button class="btn block" id="go">Ingresar</button>
      <p class="note" style="margin-top:12px">${QUIEN === 'empleado' ? '¿Todavía no tenés cuenta? Abrí el link de invitación que te mandó tu empresa.' : '¿Sos empleado? Entrá con el link de invitación que te mandó tu empresa.'}</p>` : `
      <label class="f"><b>Razón social</b><input type="text" id="rEmp"></label>
      <div class="row"><label class="f grow"><b>RUT</b><input type="text" id="rRut"></label><label class="f grow"><b>Cantidad de empleados</b><input type="number" id="rCant" min="1"></label></div>
      <label class="f"><b>Tu nombre</b><input type="text" id="rNom" autocomplete="name"></label>
      <label class="f"><b>Mail</b><input type="email" id="rEmail" autocomplete="email"></label>
      <label class="f"><b>Contraseña (mínimo 8 caracteres)</b><input type="password" id="rPass" autocomplete="new-password"></label>
      <button class="btn block" id="go">Crear cuenta y configurar el plan</button>`}
    <p class="note" id="err" style="color:var(--bad);margin-top:10px"></p></div>
    <p class="note" style="text-align:center">MVP de un proyecto de Nuevos Emprendimientos · Universidad ORT Uruguay</p></div>`;
  root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { AUTHTAB = b.dataset.t; authView(); });
  $('go').onclick = async () => {
    $('err').textContent = '';
    try {
      if (AUTHTAB === 'login') await api('POST', '/api/auth/login', {email: $('lEmail').value, password: $('lPass').value});
      else await api('POST', '/api/auth/registro', {empresa: $('rEmp').value, rut: $('rRut').value, cantEmpleados: $('rCant').value, nombre: $('rNom').value, email: $('rEmail').value, password: $('rPass').value});
      boot();
    } catch(e){ $('err').textContent = e.message; }
  };
  root.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') $('go').click(); });
}

function invitationLoggedIn(t){
  root.innerHTML = `<div class="auth"><div class="card"><h1>Tenés una invitación</h1>
    <p class="sub">Ahora estás con la sesión de <b>${esc(ME.usuario.nombre)}</b> (${esc(ME.usuario.email)}). Para aceptar la invitación como empleado, cerrá esta sesión.</p>
    <button class="btn block" id="sw">Cerrar sesión y aceptar la invitación</button>
    <button class="btn sec block" id="st" style="margin-top:8px">Seguir como ${esc(ME.usuario.nombre)}</button></div></div>`;
  $('sw').onclick = async () => { await api('POST', '/api/auth/logout'); boot(); };
  $('st').onclick = () => { history.replaceState(null, '', '/app'); boot(); };
}
async function invitation(t){
  let inv; try { inv = await api('GET', '/api/invitacion/' + t); } catch(e){ root.innerHTML = `<div class="auth"><div class="card"><h1>Invitación no válida</h1><p class="sub">${esc(e.message)}</p><a class="btn" href="/app">Ir a ingresar</a></div></div>`; return; }
  root.innerHTML = `<div class="auth"><div class="card">
    <span class="pill p-blue">Invitación de ${esc(inv.empresa)}</span>
    <h1 style="margin:10px 0 6px">${esc(inv.nombre.split(' ')[0])}, tu empresa invierte con vos</h1>
    <p class="sub">Por cada $1 que ahorres, ${esc(inv.empresa)} pone <b>$${inv.plan.match.toFixed(2)}</b>, hasta el ${pct(inv.plan.tope)} de tu sueldo. Todo se invierte en fondos indexados globales en una cuenta a tu nombre.</p>
    <label class="f"><b>Mail</b><input type="email" id="iEmail" value="${esc(inv.email || '')}"></label>
    <label class="f"><b>Creá tu contraseña (mínimo 8 caracteres)</b><input type="password" id="iPass" autocomplete="new-password" ${ME.empresa?.simulacion ? 'value="simulacion"' : ''}></label>
    <button class="btn block" id="go">Crear mi cuenta</button><p class="note" id="err" style="color:var(--bad);margin-top:10px"></p></div></div>`;
  $('go').onclick = async () => { try { await api('POST', '/api/invitacion/' + t, {email: $('iEmail').value, password: $('iPass').value}); history.replaceState(null, '', '/app'); boot(); } catch(e){ $('err').textContent = e.message; } };
}

// ================= EMPRESA =================
function planForm(e){
  return `<div class="card"><h2>¿Cuánto pone la empresa?</h2>
      <label class="f"><b>Por cada $1 del empleado <output id="oM">$${(+e.match).toFixed(2)}</output></b><input type="range" id="pM" min="0.25" max="1" step="0.25" value="${e.match}"></label>
      <label class="f"><b>Tope del aporte de la empresa <output id="oT">${pct(e.tope)} del sueldo</output></b><input type="range" id="pT" min="1" max="15" step="0.5" value="${e.tope}"></label></div>
    <div class="card"><h2>¿Cuándo es del empleado el aporte de la empresa?</h2><div class="opts">
      ${[[3,'Vesting 3 años','⅓ por cada año en el plan.'],[5,'Vesting 5 años','20% por año.'],[0,'Sin vesting','Es del empleado desde el primer día.']].map(v => `<button class="opt ${+e.vesting === v[0] ? 'on' : ''}" data-v="${v[0]}"><b>${v[1]}</b><span>${v[2]}</span></button>`).join('')}</div>
      <p class="note" style="margin:10px 0 0">Si alguien se va antes, la parte no adquirida vuelve a la empresa. El aporte propio del empleado siempre es suyo.</p></div>
    <div class="card"><h2>¿Dónde se invierte?</h2><p style="margin:0">Fondos indexados globales: cada empleado elige <b>MSCI World (URTH)</b> o <b>S&P 500 (SPY)</b>. Las cuotas se registran al precio real de mercado del mes.</p>
      <label class="f" style="margin:14px 0 0"><b>Tipo de cambio de referencia ($ por US$)</b><input type="number" id="pTC" step="0.1" value="${e.tc}" style="max-width:160px"></label></div>`;
}
function bindPlan(e, onSave){
  const st = {match: +e.match, tope: +e.tope, vesting: +e.vesting};
  $('pM').oninput = ev => { st.match = +ev.target.value; $('oM').textContent = '$' + st.match.toFixed(2); };
  $('pT').oninput = ev => { st.tope = +ev.target.value; $('oT').textContent = pct(st.tope) + ' del sueldo'; };
  root.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { st.vesting = +b.dataset.v; root.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); });
  $('savePlan').onclick = async () => { try { const r = await api('PUT', '/api/empresa/plan', {...st, tc: $('pTC').value}); ME.empresa = r.empresa; toast('Plan guardado'); onSave(); } catch(err){ toast(err.message); } };
}
function costBox(e){
  return `<div class="card" style="position:sticky;top:16px"><h2>Costo estimado</h2>
    <label class="f"><b>Empleados</b><input type="number" id="ceN" value="${e.cantEmpleados || 50}" min="1"></label>
    <label class="f"><b>Sueldo nominal promedio ($)</b><input type="number" id="ceS" value="80000" step="1000"></label>
    <label class="f"><b>Adhesión esperada <output id="ceAo">60%</output></b><input type="range" id="ceA" min="10" max="100" step="5" value="60"></label>
    <label class="f"><b>Aporte típico del empleado <output id="cePo">4%</output></b><input type="range" id="ceP" min="1" max="15" step="0.5" value="4"></label>
    <div id="ceOut"></div></div>`;
}
function bindCost(getPlan){
  const upd = () => {
    const pl = getPlan(), N = +$('ceN').value || 0, S = +$('ceS').value || 0, A = +$('ceA').value / 100, P = +$('ceP').value;
    $('ceAo').textContent = Math.round(A * 100) + '%'; $('cePo').textContent = pct(P);
    const n = Math.round(N * A), co = Math.min(P * pl.match, pl.tope), mes = n * S * co / 100, fee = n * 250;
    $('ceOut').innerHTML = `<div class="mv"><span>${n} adheridos · empresa pone ${pct(co)}</span><b>${money(mes)}/mes</b></div><div class="mv"><span>Servicio (${money(250)} por adherido)</span><b>${money(fee)}/mes</b></div>

  const W = 340, H = 160, L = 4, R = 336, T = 10, B = 140, max = Math.max(...view.map(p => Math.max(p.valor, p.aportado))) * 1.06 || 1;
  const x = i => view.length > 1 ? L + i / (view.length - 1) * (R - L) : (L + R) / 2, y = v => B - v / max * (B - T);
  const line = view.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const area = view.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.aportado).toFixed(1)}`).join(' ') + ` L${x(view.length - 1)},${B} L${x(0)},${B} Z`;
  const first = view[0], last = view[view.length - 1], dep = last.aportado - first.aportado;
  const varPer = RANGE === 'todo' ? last.valor - last.aportado : last.valor - first.valor - dep;
  const lm = P.length > 1 ? P[P.length - 2] : null, lmDep = lm ? last.aportado - lm.aportado : 0, lmR = lm && lm.valor ? (last.valor - lm.valor - lmDep) / lm.valor : null;
  const pxs = Object.entries(k.cuotas);
  // rendimiento del fondo (ponderado por tiempo): lo que rindió US$ 1 invertido el primer mes
  let twr = 1; for (let i = 1; i < P.length; i++){ const dep = P[i].aportado - P[i - 1].aportado; if (P[i - 1].valor > 0) twr *= (P[i].valor - dep) / P[i - 1].valor; }
  twr = P.length > 1 ? twr - 1 : null;
  const anios = Math.max(1, P.length - 1) / 12;
  $('ec').innerHTML = `<h1>Mi cuenta</h1>
    <div class="note" style="margin-top:8px">Valor de la cuenta</div><div class="big">${usd(k.valor)}</div>
    <div style="font-size:13px;font-weight:600;color:${col(varPer)}">${varPer >= 0 ? '▲' : '▼'} ${usd(Math.abs(varPer))} ${RANGE === 'todo' ? 'desde el inicio' : RANGE === '1a' ? 'en el último año' : 'en los últimos 6 meses'} <span class="note" style="font-weight:400">(sin contar aportes)</span></div>
    <div class="row" style="gap:6px;margin:12px 0 4px">${[['6m','6M'],['1a','1A'],['todo','Desde inicio']].map(o => `<button class="btn sm ${RANGE === o[0] ? '' : 'sec'}" data-r="${o[0]}" style="flex:1">${o[1]}</button>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H + 14}" width="100%" role="img" aria-label="Valor de la cuenta frente a lo aportado"><path d="${line} L${x(view.length - 1)},${B} L${x(0)},${B} Z" fill="#1f6feb" fill-opacity=".1"/><path d="${area}" fill="#c5c9d0" fill-opacity=".6"/><path d="${line}" fill="none" stroke="#1f6feb" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(view.length - 1)}" cy="${y(last.valor)}" r="3.5" fill="#1f6feb"/>
      <text x="${L}" y="${H + 10}" font-size="10" fill="#5d6675">${per(first.periodo)}</text><text x="${R}" y="${H + 10}" font-size="10" fill="#5d6675" text-anchor="end">${per(last.periodo)}</text></svg>
    <div class="leg"><span style="--c:#1f6feb">Valor de la cuenta</span><span style="--c:#c5c9d0">Lo que se aportó</span></div>
    <div class="grid2">
      <div class="kpi"><div class="l">Rendimiento anualizado</div><div class="v" style="font-size:19px;color:${col(k.tirAnual ?? 0)}">${sgn(k.tirAnual)}</div><div class="s">TIR desde el inicio</div></div>
      <div class="kpi"><div class="l">Rendimiento del fondo</div><div class="v" style="font-size:19px;color:${col(twr ?? 0)}">${sgn(twr)}</div><div class="s">desde ${per(k.inicio)} (${anios.toLocaleString('es-UY', {maximumFractionDigits:1})} años)</div></div>
      <div class="kpi"><div class="l">Ganancia total</div><div class="v" style="font-size:19px">${usd(k.ganancia)}</div><div class="s">${sgn(k.rendimiento)} sobre lo aportado</div></div>
      <div class="kpi"><div class="l">Último mes</div><div class="v" style="font-size:19px;color:${col(lmR ?? 0)}">${sgn(lmR)}</div><div class="s">${per(last.periodo)}</div></div></div>
    <div class="mc"><h3>Tu cartera</h3>${pxs.map(([t, q]) => `<div class="mv"><span><b>${t}</b><small>${esc(C.fondos[t].nombre)}</small></span><span style="text-align:right"><b>${usd(q * C.precios[t].actual)}</b><small>${q.toFixed(4)} cuotas × ${usd(C.precios[t].actual)}</small></span></div>`).join('')}
      <p class="note" style="margin:6px 0 0">Precio de mercado${C.precios[pxs[0][0]].actualizado ? ' al ' + new Date(C.precios[pxs[0][0]].actualizado).toLocaleString('es-UY') : ''} · fuente Yahoo Finance.</p></div>
    <div class="mc"><h3>Composición del valor</h3>
      <div class="mv"><span>Tus aportes</span><b>${usd(k.aportadoPropioUsd)}</b></div><div class="mv"><span>Aportes de ${esc(C.empresa.nombre)}</span><b style="color:var(--accent)">${usd(k.aportadoEmpresaUsd)}</b></div>
      <div class="mv"><span>Rendimiento</span><b style="color:${col(k.ganancia)}">${usd(k.ganancia)}</b></div><div class="mv"><span><b>Valor de la cuenta</b></span><b>${usd(k.valor)}</b></div>
      <div class="mv"><span>Si te vas hoy te llevás</span><b>${usd(k.siTeVas)}</b></div></div>
    <div class="mc"><h3>Datos de la cuenta</h3><div class="mv"><span>Inicio</span><span>${per(k.inicio)}</span></div><div class="mv"><span>Meses con aportes</span><span>${k.meses}</span></div><div class="mv"><span>Custodio</span><span>Interactive Brokers</span></div></div>
    <p class="note"><b>Cómo leer los rendimientos.</b> El <b>rendimiento del fondo</b> es lo que rindió un dólar invertido el primer mes. El <b>anualizado</b> es ese rendimiento llevado a un año, considerando cuándo entró cada aporte. La <b>ganancia sobre lo aportado</b> es menor porque los aportes entran mes a mes: los últimos llevan poco tiempo invertidos.</p>
    <p class="note">Valores en dólares. Rendimientos pasados no garantizan rendimientos futuros.</p>`;
  $('ec').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { RANGE = b.dataset.r; eCuenta(); });
}
function eMovs(){
  $('ec').innerHTML = `<h1>Movimientos</h1>` + (C.movimientos.length ? `<div class="mc">${C.movimientos.map(m => `<div class="mv"><span>Compra ${m.fondo} · ${per(m.periodo)}<small>${m.cuotas.toFixed(4)} cuotas a ${usd(m.precio)} · vos ${usd(m.usdEmpleado)} + empresa ${usd(m.usdEmpresa)}</small></span><b>+ ${usd(m.usd)}</b></div>`).join('')}</div>` : '<div class="empty">Todavía no hay movimientos.</div>');
}
function eAporte(){
  const e = C.empleado, pl = C.empresa; let v = e.pct, f = e.fondo;
  const draw = () => {
    const co = Math.min(v * pl.match, pl.tope);
    $('ec').innerHTML = `<h1>Mi aporte</h1><div class="mc" style="text-align:center"><div class="big">${pct(v)}</div><div class="note">${money(e.sueldo * v / 100)} por mes · la empresa suma ${money(e.sueldo * co / 100)}</div><input type="range" id="aP" min="1" max="15" step="0.5" value="${v}" style="margin-top:10px"></div>
      <div class="mc"><h3>Dónde invertir los próximos aportes</h3>${Object.entries(C.fondos).map(([t, x]) => `<button class="opt ${f === t ? 'on' : ''}" data-f="${t}" style="width:100%;margin-top:8px"><b>${x.corto} · ${t}</b></button>`).join('')}</div>
      <button class="btn block" id="aS" style="margin-top:14px">Guardar cambios</button>
      <button class="btn sec block" id="aZ" style="margin-top:8px">${e.estado === 'pausado' ? 'Retomar mi aporte' : 'Pausar mi aporte'}</button><p class="note">Los cambios aplican desde el próximo cierre.</p>`;
    $('aP').oninput = ev => { v = +ev.target.value; draw(); };
    $('ec').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { f = b.dataset.f; draw(); });
    $('aS').onclick = async () => { try { await api('PUT', '/api/empleado/aporte', {pct: v, fondo: f}); toast('Aporte actualizado'); employee(); } catch(err){ toast(err.message); } };
    $('aZ').onclick = async () => { try { await api('PUT', '/api/empleado/aporte', {pausar: e.estado !== 'pausado'}); toast(e.estado === 'pausado' ? 'Aporte retomado' : 'Aporte pausado'); employee(); } catch(err){ toast(err.message); } };
  };
  draw();
}

boot().catch(e => { root.innerHTML = `<div class="auth"><div class="card"><h1>No se pudo cargar</h1><p class="sub">${esc(e.message)}</p></div></div>`; });
})();
</script>
</body>
</html>
